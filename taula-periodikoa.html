            'metaloidea': 'Metaloideak',
            'ez-metala': 'Ez-metalak',
            'halogeno': 'Halogenoak',
            'gas-noblea': 'Gas nobleak',
            'lantanidoa': 'Lantanidoak',
            'aktinidoa': 'Aktinidoak',

                        height: '16px',

                        {kategoriakIzenak[kategoria]}
                      </span>
                    </div>
                  ))}
                </div>

                {kategoriaIragazkia && (
                  <div style={{ marginBottom: '1rem', textAlign: 'center' }}>
                    <button
                      onClick={() => setKategoriaIragazkia(null)}

                        display: 'inline-flex',
                        alignItems: 'center',
                        gap: '0.5rem',
                        padding: '0.6rem 1.2rem',
                        background: 'rgba(255,255,255,0.1)',
                        border: '2px solid rgba(255,255,255,0.2)',
                        borderRadius: '8px',
                        color: '#fff',
                        fontSize: '0.9rem',
                        fontWeight: 600,
                        cursor: 'pointer',
                        transition: 'all 0.2s',
                        fontFamily: "'Space Mono', monospace"

                      onMouseEnter={(e) => {
                        e.currentTarget.style.background = 'rgba(255,255,255,0.2)';
                        e.currentTarget.style.transform = 'translateX(-5px)';
                      }}
                      onMouseLeave={(e) => {
                        e.currentTarget.style.background = 'rgba(255,255,255,0.1)';
                        e.currentTarget.style.transform = 'translateX(0)';

                      <BackIcon />

                  </div>

                    gridTemplateColumns: 'repeat(18, 1fr)',

                        <div style={{ color: '#00d4ff' }}>{taldea}</div>

                    <div style={{
                      display: 'grid',
                      gridTemplateColumns: 'repeat(18, 1fr)',
                      gap: '3px',

                      padding: '0.5rem',
                      background: 'rgba(255,255,255,0.02)',
                      borderRadius: '0 0 10px 10px'
                    }}>
                      {elementuakErakutsi.map((elem) => (
                        <div
                          key={elem.z}
                          onClick={() => setHautatutakoElementua(elem)}
                          style={{
                            gridColumn: elem.zutabea,
                            gridRow: elem.lerroa,
                            backgroundColor: koloreakKategoriaz[elem.kategoria],
                            padding: '0.3rem',
                            borderRadius: '4px',

                            transition: 'all 0.2s',
                            fontSize: '0.6rem',
                            textAlign: 'center'

                                backgroundColor: koloreakKategoriaz[elem.kategoria],

                                borderRadius: '4px',
                                cursor: 'pointer',
                                textAlign: 'center'

                      display: 'grid',
                      gridTemplateColumns: 'repeat(18, 1fr)',
                      gap: '3px',
                      position: 'relative'
                    }}>
                      {elementuakErakutsi.map((elem) => (
                        <div
                          key={elem.z}
                          onClick={() => setHautatutakoElementua(elem)}
                          style={{
                            gridColumn: elem.zutabea,
                            gridRow: elem.lerroa,
                            backgroundColor: koloreakKategoriaz[elem.kategoria],
                            padding: '0.3rem',
                            borderRadius: '4px',
                            cursor: 'pointer',
                            transition: 'all 0.2s',
                            fontSize: '0.6rem',
                            textAlign: 'center',
                            boxShadow: `0 0 15px ${koloreakKategoriaz[elem.kategoria]}80`

                    </div>

                )}

                {hautatutakoElementua && (
                  <div
                    onClick={() => setHautatutakoElementua(null)}

                      position: 'fixed',
                      top: 0,
                      left: 0,
                      right: 0,
                      bottom: 0,
                      backgroundColor: 'rgba(0,0,0,0.85)',

                      justifyContent: 'center',

                      padding: '1rem'

                        backgroundColor: '#1e293b',

                        }}
                        onMouseEnter={(e) => {
                          e.currentTarget.style.background = 'rgba(255,255,255,0.2)';
                          e.currentTarget.style.transform = 'rotate(90deg)';
                        }}
                        onMouseLeave={(e) => {
                          e.currentTarget.style.background = 'rgba(255,255,255,0.1)';

                          width: '80px',
                          height: '80px',
                          backgroundColor: koloreakKategoriaz[hautatutakoElementua.kategoria],
                          borderRadius: '10px',
                          display: 'flex',
                          flexDirection: 'column',
                          alignItems: 'center',
                          justifyContent: 'center',
                          boxShadow: `0 10px 30px ${koloreakKategoriaz[hautatutakoElementua.kategoria]}60`

                          <h2 style={{
                            fontSize: '1.8rem',

                            color: koloreakKategoriaz[hautatutakoElementua.kategoria],
                            fontWeight: 700
                          }}>
                            {hautatutakoElementua.izena}
                          </h2>
                          <p style={{
                            fontSize: '0.9rem',
                            color: '#94a3b8',
                            margin: 0,
                            textTransform: 'capitalize'

                            {kategoriakIzenak[hautatutakoElementua.kategoria]}
                          </p>
                        </div>
                      </div>

                      <div style={{
                        display: 'grid',
                        gridTemplateColumns: '1fr 1fr',
                        gap: '1rem',
                        marginBottom: '1.2rem',
                        padding: '1rem',
                        background: 'rgba(255,255,255,0.05)',
                        borderRadius: '10px',
                        fontSize: '0.85rem'
                      }}>
                        <div>
                          <div style={{ color: '#64748b', marginBottom: '0.3rem' }}>Zenbaki atomikoa</div>
                          <div style={{ fontSize: '1.4rem', fontWeight: 700, color: '#e2e8f0' }}>
                            {hautatutakoElementua.z}

                        </div>
                        <div>
                          <div style={{ color: '#64748b', marginBottom: '0.3rem' }}>Masa atomikoa</div>
                          <div style={{ fontSize: '1.4rem', fontWeight: 700, color: '#e2e8f0' }}>
                            {hautatutakoElementua.masa}
                          </div>
                        </div>
                        {hautatutakoElementua.zutabea && taldeak[hautatutakoElementua.zutabea] && (
                          <div style={{ gridColumn: '1 / -1' }}>
                            <div style={{ color: '#64748b', marginBottom: '0.3rem' }}>Taldea</div>
                            <div style={{ fontSize: '0.95rem', fontWeight: 600, color: '#e2e8f0' }}>
                              {hautatutakoElementua.zutabea}. taldea - {taldeak[hautatutakoElementua.zutabea].izena}

                          </div>

                      </div>

                      <div style={{
                        padding: '1rem',
                        background: 'rgba(255,255,255,0.03)',

                      }}>
                        <h3 style={{
                          fontSize: '0.9rem',
                          marginBottom: '0.5rem',
                          color: '#cbd5e1',
                          fontWeight: 600
                        }}>
                          Deskribapena
                        </h3>
                        <p style={{
                          fontSize: '0.9rem',
                          color: '#94a3b8',
                          lineHeight: '1.6',
                          margin: 0

                          {hautatutakoElementua.deskribapena}
                        </p>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        };

        ReactDOM.render(<TaulaPeriodikoa />, document.getElementById('root'));
    </script>
