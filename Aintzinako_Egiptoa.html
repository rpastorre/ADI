                            background: linear-gradient(135deg, #60a5fa, #3b82f6);
                            color: #0d1b2a;
                        }

                        .action-btn.primary:hover {
                            background: linear-gradient(135deg, #3b82f6, #2563eb);
                            transform: translateY(-2px);
                            box-shadow: 0 8px 20px rgba(96, 165, 250, 0.4);
                        }

                        .action-btn.secondary {
                            background: rgba(30, 58, 95, 0.6);
                            color: #93c5fd;
                            border-color: #60a5fa;
                        }

                        .action-btn.secondary:hover {
                            background: rgba(30, 58, 95, 0.9);
                            transform: translateY(-2px);
                        }

                        .back-link {
                            display: inline-flex;
                            align-items: center;
                            gap: 0.75rem;
                            margin-top: 3rem;
                            padding: 1rem 2rem;
                            background: rgba(30, 58, 95, 0.4);
                            border: 2px solid rgba(96, 165, 250, 0.3);
                            border-radius: 10px;
                            color: #93c5fd;
                            font-family: 'Inter', sans-serif;
                            font-size: 1rem;
                            cursor: pointer;
                            transition: all 0.3s ease;
                            letter-spacing: 0.5px;
                        }

                        .back-link:hover {
                            background: rgba(30, 58, 95, 0.7);
                            border-color: #60a5fa;
                        }

                        .bukatuta-container {
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            min-height: 60vh;
                            padding: 4rem 2rem;
                        }

                        .success-card {
                            background: rgba(26, 41, 66, 0.7);
                            border: 2px solid rgba(96, 165, 250, 0.3);
                            border-radius: 16px;
                            padding: 5rem 4rem;
                            text-align: center;
                            max-width: 600px;
                            position: relative;
                            animation: bounceIn 0.8s ease-out;
                        }

                        @keyframes bounceIn {
                            0% {
                                opacity: 0;
                                transform: scale(0.3);
                            }
                            50% {
                                transform: scale(1.05);
                            }
                            100% {
                                opacity: 1;
                                transform: scale(1);
                            }
                        }

                        .success-icon {
                            width: 120px;
                            height: 120px;
                            margin: 0 auto 2rem;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            background: linear-gradient(135deg, #60a5fa, #3b82f6);
                            border-radius: 50%;
                            color: #0d1b2a;
                            box-shadow: 0 8px 24px rgba(96, 165, 250, 0.5);
                        }

                        .success-icon svg {
                            width: 72px;
                            height: 72px;
                        }

                        .success-title {
                            font-family: 'Playfair Display', serif;
                            font-size: 3.5rem;
                            font-weight: 700;
                            color: #60a5fa;
                            margin-bottom: 1.5rem;
                            letter-spacing: 2px;
                            text-transform: uppercase;
                        }

                        .success-message {
                            font-family: 'Inter', sans-serif;
                            font-size: 1.8rem;
                            color: #93c5fd;
                            margin-bottom: 3rem;
                            font-style: italic;
                        }

                        .restart-btn {
                            padding: 1.5rem 3rem;
                            background: linear-gradient(135deg, #60a5fa, #3b82f6);
                            border: none;
                            border-radius: 12px;
                            color: #0d1b2a;
                            font-family: 'Inter', sans-serif;
                            font-size: 1.2rem;
                            font-weight: 700;
                            cursor: pointer;
                            transition: all 0.3s ease;
                            box-shadow: 0 8px 24px rgba(96, 165, 250, 0.4);
                            letter-spacing: 1px;
                            text-transform: uppercase;
                        }

                        .restart-btn:hover {
                            transform: translateY(-3px);
                            box-shadow: 0 12px 32px rgba(96, 165, 250, 0.6);
                            background: linear-gradient(135deg, #3b82f6, #2563eb);
                        }

                        @media (max-width: 968px) {
                            .app-header {
                                flex-direction: column;
                                gap: 2rem;
                                padding: 2rem;
                            }

                            .logo-text {
                                font-size: 1.6rem;
                            }

                            .header-nav {
                                width: 100%;
                            }

                            .header-nav-btn {
                                flex: 1;
                                justify-content: center;
                            }

                            .section-header h1 {
                                font-size: 2.2rem;
                            }

                            .teoria-layout {
                                grid-template-columns: 1fr;
                            }

                            .topics-sidebar {
                                order: 2;
                                margin-top: 2rem;
                            }

                            .content-main {
                                order: 1;
                            }

                            .question-card {
                                padding: 2.5rem 2rem;
                            }

                            .question-text {
                                font-size: 1.5rem;
                            }

                            .action-buttons {
                                flex-direction: column;
                            }

                            .action-btn {
                                width: 100%;
                                justify-content: center;
                            }
                        }
                    `}</style>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EgiptoApp />);
    </script>
</body>
